<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TM-SOLAR | Shopping Cart</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8f6;color:#222}header{background:#123d2a;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}.header-inner{max-width:1200px;margin:auto;min-height:65px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:800;white-space:nowrap}.logo .tm{color:#D32F2F}.logo .solar{color:#B8860B}.tagline{font-size:12px;color:#ddd;margin-top:2px}.back-link{color:#fff;text-decoration:none;font-weight:600;font-size:14px}main{max-width:1100px;margin:auto;padding:30px 15px 60px}h1{color:#123d2a;margin-bottom:25px}.cart-layout{display:grid;grid-template-columns:1fr 350px;gap:25px;align-items:start}.cart-items,.summary{background:#fff;border:1px solid #e1e6e2;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.05)}.cart-items{padding:15px}.cart-item{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;padding:15px 5px;border-bottom:1px solid #e7ebe8}.cart-item:last-child{border-bottom:0}.item-image{width:110px;height:100px;background:#fafbfa;border-radius:8px;padding:5px}.item-image img{width:100%;height:100%;object-fit:contain}.item-model{font-size:13px;color:#777;font-weight:700;margin-bottom:5px}.item-name{color:#123d2a;font-size:17px;font-weight:700;margin-bottom:8px}.item-weight{color:#666;font-size:13px}.item-price{margin-top:7px;font-weight:700}.quantity-control{display:flex;align-items:center;gap:8px;margin-top:10px}.quantity-control button{width:30px;height:30px;border:1px solid #ccc;background:#fff;border-radius:5px;cursor:pointer;font-size:18px}.quantity-control span{min-width:25px;text-align:center;font-weight:700}.remove-button{border:0;background:transparent;color:#c62828;cursor:pointer;font-size:13px;margin-top:8px}.item-total{font-size:18px;font-weight:800;color:#123d2a;white-space:nowrap}.summary{padding:22px;position:sticky;top:85px}.summary h2{margin-top:0;color:#123d2a}.summary-row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;color:#555}.summary-row.total-weight{color:#123d2a;font-weight:700}.summary-row.grand-total{border-top:1px solid #ddd;margin-top:10px;padding-top:15px;color:#123d2a;font-size:21px;font-weight:800}.checkout-button{width:100%;border:0;background:#123d2a;color:#fff;padding:15px;border-radius:8px;margin-top:18px;font-size:16px;font-weight:700;cursor:pointer}.checkout-button:hover{background:#1b5a3d}.continue-button{display:block;text-align:center;margin-top:12px;color:#123d2a;text-decoration:none;font-size:14px;font-weight:600}.empty-cart{text-align:center;padding:60px 20px}.empty-cart h2{color:#123d2a}.empty-cart a{display:inline-block;margin-top:15px;padding:12px 20px;background:#123d2a;color:#fff;text-decoration:none;border-radius:7px}@media(max-width:800px){.cart-layout{grid-template-columns:1fr}.summary{position:static}}@media(max-width:600px){.header-inner{padding:10px 12px}.cart-item{grid-template-columns:80px 1fr;gap:12px}.item-image{width:80px;height:80px}.item-total{grid-column:2;margin-top:-5px}main{padding:20px 10px 50px}}
</style>
</head>
<body>
<header><div class="header-inner"><div><div class="logo">☀ <span class="tm">TM</span><span class="solar">-SOLAR</span></div><div class="tagline">Solar Lighting Solutions</div></div><a href="products.html" class="back-link">← Continue Shopping</a></div></header>
<main><h1>Your Shopping Cart</h1><div id="cartContent"></div></main>
<script>
const CART_KEY="tmSolarCart";
const IMAGE_FOLDER="images/";
let cart=[];
function loadCart(){try{cart=JSON.parse(localStorage.getItem(CART_KEY))||[]}catch(e){cart=[]}}
function saveCart(){localStorage.setItem(CART_KEY,JSON.stringify(cart))}
function formatPrice(v){return Number(v||0).toLocaleString("en-IN")}
function renderCart(){const c=document.getElementById("cartContent");if(!cart.length){c.innerHTML='<div class="cart-items empty-cart"><h2>Your cart is empty</h2><p>Please select some solar products before proceeding.</p><a href="products.html">Browse Products</a></div>';return}let productTotal=0,totalWeight=0,totalQuantity=0,html="";cart.forEach((item,index)=>{const q=Number(item.quantity||1),price=Number(item.MRP||0),weight=Number(item["NetWeight"]||0),itemTotal=price*q;productTotal+=itemTotal;totalWeight+=weight*q;totalQuantity+=q;html+=`<div class="cart-item"><div class="item-image"><img src="${IMAGE_FOLDER}${encodeURIComponent(item.Image||item.Model+".png")}" alt="${item.Model}" onerror="this.style.display='none'"></div><div><div class="item-model">${item.Model}</div><div class="item-name">${item.Name}</div><div class="item-weight">Net Weight: ${weight.toFixed(3)} KG / piece</div><div class="item-price">MRP: ₹${formatPrice(price)}</div><div class="quantity-control"><button onclick="changeQuantity(${index},-1)">−</button><span>${q}</span><button onclick="changeQuantity(${index},1)">+</button></div><button class="remove-button" onclick="removeItem(${index})">Remove</button></div><div class="item-total">₹${formatPrice(itemTotal)}</div></div>`});c.innerHTML=`<div class="cart-layout"><div class="cart-items">${html}</div><div class="summary"><h2>Order Summary</h2><div class="summary-row"><span>Products</span><strong>${totalQuantity}</strong></div><div class="summary-row total-weight"><span>Total Weight</span><strong>${totalWeight.toFixed(3)} KG</strong></div><div class="summary-row"><span>Product Total</span><strong>₹${formatPrice(productTotal)}</strong></div><div class="summary-row"><span>Courier</span><strong>Calculated at checkout</strong></div><div class="summary-row grand-total"><span>Grand Total</span><span>₹${formatPrice(productTotal)}</span></div><button class="checkout-button" onclick="proceedToCheckout()">Proceed to Checkout</button><a href="products.html" class="continue-button">← Continue Shopping</a></div></div>`}
function changeQuantity(i,change){if(!cart[i])return;cart[i].quantity=Number(cart[i].quantity||1)+change;if(cart[i].quantity<=0)cart.splice(i,1);saveCart();renderCart()}
function removeItem(i){if(!cart[i])return;cart.splice(i,1);saveCart();renderCart()}
function proceedToCheckout(){if(cart.length)window.location.href="checkout.html"}
loadCart();renderCart();
</script>
</body>
</html>
