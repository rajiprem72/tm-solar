<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TM-SOLAR | Checkout</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8f6;color:#222}
header{background:#123d2a;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.header-inner{max-width:1150px;margin:auto;min-height:68px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:25px;font-weight:800}.brand .tm{color:#D32F2F}.brand .solar{color:#B8860B}.tagline{font-size:12px;color:#ddd;margin-top:2px}
.back-link{color:#fff;text-decoration:none;font-weight:600;font-size:14px}
main{max-width:1150px;margin:auto;padding:30px 15px 60px}h1{color:#123d2a;margin:0 0 25px}
.layout{display:grid;grid-template-columns:1fr 380px;gap:25px;align-items:start}.card{background:#fff;border:1px solid #e1e6e2;border-radius:12px;padding:24px;box-shadow:0 3px 12px rgba(0,0,0,.05);margin-bottom:20px}.card h2{color:#123d2a;margin:0 0 20px;font-size:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:14px;font-weight:700;color:#444}.required{color:#c62828}
input,textarea,select{width:100%;border:1px solid #ccd3ce;border-radius:7px;padding:12px;font-size:15px;font-family:inherit;background:#fff}textarea{min-height:95px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:#123d2a;box-shadow:0 0 0 2px rgba(18,61,42,.08)}
.hint,.note{color:#777;font-size:12px;line-height:1.45}.summary{position:sticky;top:85px}.row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;color:#555}.weight,.courier{color:#123d2a;font-weight:700}
.grand{border-top:1px solid #ddd;margin-top:10px;padding-top:17px;color:#123d2a;font-size:23px;font-weight:800}
.items{margin-bottom:18px}.item{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}.item:last-child{border-bottom:0}.amount{font-weight:700;white-space:nowrap}
.courier-info{margin-top:12px;padding:11px;background:#f4f7f4;border-radius:7px;color:#555;font-size:13px;line-height:1.45}
.pay{width:100%;border:0;background:#123d2a;color:#fff;padding:15px;border-radius:8px;margin-top:20px;font-size:16px;font-weight:700;cursor:pointer}.pay:hover{background:#1b5a3d}
.back-cart{display:block;text-align:center;margin-top:13px;color:#123d2a;text-decoration:none;font-weight:600;font-size:14px}
.message{display:none;padding:12px;border-radius:7px;margin-bottom:15px;font-size:14px}.error{display:block;background:#fff0f0;color:#a32020;border:1px solid #f0caca}
.empty{text-align:center;max-width:600px;margin:60px auto}.empty a{display:inline-block;margin-top:15px;background:#123d2a;color:#fff;padding:12px 20px;border-radius:7px;text-decoration:none}
.review{
    display:none;
}

.review.show{
    display:block;
}

.review-box{
    border:1px solid #dce5de;
    border-radius:9px;
    overflow:hidden;
}

.review-section{
    padding:16px;
    border-bottom:1px solid #e8ece9;
}

.review-section:last-child{
    border-bottom:0;
}

.review-title{
    font-weight:800;
    color:#123d2a;
    margin-bottom:10px;
}

.review-line{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:6px 0;
    font-size:14px;
}

.review-line small{
    color:#777;
}

.review-address{
    line-height:1.6;
    color:#555;
    font-size:14px;
}

.coupon-area{
    margin-top:16px;
    padding:14px;
    background:#f8faf8;
    border:1px solid #e1e8e2;
    border-radius:8px;
}

.coupon-title{
    font-weight:800;
    color:#123d2a;
    margin-bottom:7px;
}

.coupon-box{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.coupon-box input{
    flex:1;
    text-transform:uppercase;
}

.coupon-btn{
    border:0;
    background:#555;
    color:#fff;
    padding:0 16px;
    border-radius:7px;
    font-weight:700;
    cursor:pointer;
}

.coupon-btn:hover{
    background:#333;
}

.coupon-message{
    font-size:13px;
    margin-top:8px;
    min-height:18px;
}

.coupon-success{
    color:#188038;
}

.coupon-error{
    color:#c62828;
}

.confirm-box{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-top:18px;
    padding:14px;
    background:#f8faf8;
    border-radius:8px;
}

.confirm-box input{
    width:18px;
    height:18px;
    margin-top:2px;
}

.confirm-box label{
    font-weight:600;
    line-height:1.5;
}

.pay:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.edit-btn{
    width:100%;
    border:1px solid #123d2a;
    background:#fff;
    color:#123d2a;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.discount{
    color:#188038;
    font-weight:700;
}

.final-total{
    text-align:right;
    font-size:24px;
    font-weight:800;
    color:#123d2a;
    margin-top:12px;
}
@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{position:static}}@media(max-width:600px){.header-inner{padding:10px 12px}.brand{font-size:21px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}main{padding:20px 10px 50px}}
</style>
</head>
<body>
<header><div class="header-inner">
<div><div class="brand">☀ <span class="tm">TM</span><span class="solar">-SOLAR</span></div><div class="tagline">Solar Lighting Solutions</div></div>
<a href="cart.html" class="back-link">← Back to Cart</a>
</div></header>

<main>
<h1>Checkout</h1>
<div id="message" class="message"></div>
<div id="content"></div>
</main>

<script>
const CART_KEY="tmSolarCart";

const COURIER_URL="data/courier.json";

const COUPON_URL="data/coupons.json";

let cart=[];

let courierConfig=null;

let couponConfig=null;

let appliedCoupon=null;

const states=["Andaman and Nicobar Islands","Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chandigarh","Chhattisgarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Goa","Gujarat","Haryana","Himachal Pradesh","Jammu and Kashmir","Jharkhand","Karnataka","Kerala","Ladakh","Lakshadweep","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Puducherry","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal"];

function money(v){return Number(v||0).toLocaleString("en-IN")}

function loadCart(){
    try{cart=JSON.parse(localStorage.getItem(CART_KEY))||[]}
    catch(e){cart=[]}
}

function totals(){
    let productTotal=0,totalWeight=0,totalQuantity=0;
    cart.forEach(item=>{
        const q=Number(item.quantity||1);
        productTotal+=Number(item.MRP||0)*q;
        totalWeight+=Number(item.NetWeight||0)*q;
        totalQuantity+=q;
    });
    return {productTotal,totalWeight,totalQuantity};
}


function courier(address, state){

    const s = String(state || "").trim();

    if (!s) {

        return {
            rate: 0,
            charge: 0,
            description: "Select state"
        };

    }

    // Tamil Nadu
    if (s === "Tamil Nadu") {

        return {
            rate: 60,
            charge: 60,
            description: "Tamil Nadu — ₹60 per bill"
        };

    }

    // Kerala, Karnataka, Andhra Pradesh,
    // Telangana
    const selectedStates = [
        "Kerala",
        "Karnataka",
        "Andhra Pradesh",
        "Telangana"
    ];

    if (selectedStates.includes(s)) {

        return {
            rate: 120,
            charge: 120,
            description: s + " — ₹120 per bill"
        };

    }

    // All other Indian states
    return {

        rate: 250,
        charge: 250,
        description: s + " — ₹250 per bill"

    };

}


function findCoupon(code){

    if (!couponConfig || !code) {
        return null;
    }

    const enteredCode =
        String(code)
            .trim()
            .toUpperCase();

    const coupons =
        couponConfig.Coupons || [];

    return coupons.find(coupon => {

        return (
            String(coupon.Code || "")
                .trim()
                .toUpperCase()
            === enteredCode
            &&
            coupon.Active === true
        );

    }) || null;

}


function calculateCouponDiscount(
    coupon,
    productTotal
){

    if (!coupon) {
        return 0;
    }

    const minimumOrder =
        Number(
            coupon.MinimumOrderValue || 0
        );

    if (
        productTotal < minimumOrder
    ) {
        return 0;
    }

    if (
        String(
            coupon.DiscountType || ""
        ).toUpperCase() === "FLAT"
    ){

        return Math.min(
            Number(
                coupon.DiscountValue || 0
            ),
            productTotal
        );

    }

    return 0;

}


function applyCoupon(){

    const input =
        document.getElementById(
            "couponCode"
        );

    const message =
        document.getElementById(
            "couponMessage"
        );

    const code =
        input.value.trim();


    appliedCoupon = null;


    if (!code){

        message.className =
            "coupon-message coupon-error";

        message.textContent =
            "Please enter a coupon code.";

        updateFinalReview();

        return;

    }


    const coupon =
        findCoupon(code);


    if (!coupon){

        message.className =
            "coupon-message coupon-error";

        message.textContent =
            "Invalid coupon code.";

        updateFinalReview();

        return;

    }


    const t = totals();


    const discount =
        calculateCouponDiscount(
            coupon,
            t.productTotal
        );


    if (discount <= 0){

        message.className =
            "coupon-message coupon-error";

        message.textContent =
            "This coupon is not applicable to this order.";

        updateFinalReview();

        return;

    }


    appliedCoupon = {

        Code: coupon.Code,

        DiscountType:
            coupon.DiscountType,

        DiscountValue:
            discount

    };


    message.className =
        "coupon-message coupon-success";

    message.textContent =
        "Coupon discount applied successfully.";


    updateFinalReview();

}    

function getFinalAmount(){

    const t = totals();

    const state =
        document.getElementById("state").value;

    const address =
        document.getElementById("address").value;

    const x =
        courier(address, state);

    const discount =
        appliedCoupon
            ? Number(appliedCoupon.DiscountValue || 0)
            : 0;

    return {

        productTotal:
            t.productTotal,

        totalWeight:
            t.totalWeight,

        totalQuantity:
            t.totalQuantity,

        courierCharge:
            x.charge,

        courierDescription:
            x.description,

        couponCode:
            appliedCoupon
                ? appliedCoupon.Code
                : "",

        couponDiscount:
            discount,

        grandTotal:
            Math.max(
                0,
                t.productTotal +
                x.charge -
                discount
            )

    };

}


function updateFinalReview(){

    const review =
        document.getElementById(
            "reviewContent"
        );

    if (!review) return;

    const final =
        getFinalAmount();

    const discountLine =
        final.couponDiscount > 0

        ? `
            <div class="review-line discount">

                <span>
                    Coupon Code Discount
                </span>

                <strong>
                    -₹${money(
                        final.couponDiscount
                    )}
                </strong>

            </div>
          `

        : "";


    const grand =
        document.getElementById(
            "reviewGrand"
        );

    if (grand){

        grand.textContent =
            "₹" +
            money(
                final.grandTotal
            );

    }


    const reviewDiscount =
        document.getElementById(
            "reviewDiscount"
        );

    if (reviewDiscount){

        reviewDiscount.innerHTML =
            discountLine;

    }

}    
    
function showError(text){
    const m=document.getElementById("message");
    m.className="message error";m.textContent=text;
    window.scrollTo({top:0,behavior:"smooth"});
}

function render(){
    const c=document.getElementById("content");
    if(!cart.length){
        c.innerHTML='<div class="card empty"><h2>Your cart is empty</h2><p>Please select some solar products before checkout.</p><a href="products.html">Browse Products</a></div>';
        return;
    }

    const t=totals();
    let items="";
    cart.forEach(item=>{
        const q=Number(item.quantity||1);
        items+=`<div class="item"><span>${item.Model} × ${q}</span><span class="amount">₹${money(Number(item.MRP||0)*q)}</span></div>`;
    });

    c.innerHTML=`
    <div class="layout">
      <div>
        <div class="card">
          <h2>Customer Details</h2>
          <div class="form-grid">
            <div class="field"><label>Full Name <span class="required">*</span></label><input id="fullName" autocomplete="name" placeholder="Enter your full name"></div>
            <div class="field"><label>Mobile Number <span class="required">*</span></label><input id="mobile" type="tel" maxlength="10" inputmode="numeric" autocomplete="tel" placeholder="10 digit mobile number"></div>
            <div class="field full"><label>Email ID <span class="required">*</span></label><input id="email" type="email" autocomplete="email" placeholder="Enter your email address"></div>
          </div>
        </div>

        <div class="card">
          <h2>Delivery Address</h2>
          <div class="form-grid">
            <div class="field full">

    <label>
        Address <span class="required">*</span>
    </label>

    <textarea
        id="address"
        autocomplete="street-address"
        placeholder="House / Door No., Street, Area, Locality"></textarea>

    <div class="hint">
        Courier charges are based on the selected
        state and are charged once per bill.
    </div>

</div>

<div class="field">     
            <label>City / Town <span class="required">*</span></label><input id="city" autocomplete="address-level2"></div>
            <div class="field"><label>District</label><input id="district"></div>
            <div class="field"><label>State <span class="required">*</span></label><select id="state"><option value="">Select State</option>${states.map(s=>`<option>${s}</option>`).join("")}</select></div>
            <div class="field"><label>Pincode <span class="required">*</span></label><input id="pincode" maxlength="6" inputmode="numeric" autocomplete="postal-code" placeholder="6 digit pincode"></div>
          </div>
        </div>
      
               <div class="card review" id="reviewCard">

            <h2>Final Order Review</h2>

            <p class="note">
                Please review your products, charges and
                delivery details carefully before proceeding
                to payment.
            </p>

            <div id="reviewContent"
                 class="review-box">
            </div>

            <div class="coupon-area">

                <div class="coupon-title">
                    Do you have a coupon code?
                </div>

                <div class="hint">
                    Enter your privileged coupon code
                    if you have one.
                </div>

                <div class="coupon-box">

                    <input
                        id="couponCode"
                        placeholder="Enter coupon code"
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        class="coupon-btn"
                        id="applyCoupon"
                    >
                        Apply
                    </button>

                </div>

                <div
                    id="couponMessage"
                    class="coupon-message">
                </div>

            </div>

            <div class="confirm-box">

                <input
                    type="checkbox"
                    id="confirmOrder"
                >

                <label for="confirmOrder">

                    I confirm that the products,
                    quantities, charges and delivery
                    address shown above are correct.

                </label>

            </div>

            <button
                class="pay"
                id="payButton"
                disabled
            >
                Proceed to Razorpay
            </button>

            <button
                type="button"
                class="edit-btn"
                id="editOrder"
            >
                ← Edit Order Details
            </button>

        </div> 
      </div>  
      <div class="card summary">
        <h2>Order Summary</h2>
        <div class="items">${items}</div>
        <div class="row"><span>Products</span><strong>${t.totalQuantity}</strong></div>
        <div class="row weight"><span>Total Weight</span><strong id="weight">${t.totalWeight.toFixed(3)} KG</strong></div>
<div class="row">
    <span>Product Total (incl. GST)</span>
    <strong>
        ₹${money(t.productTotal)}
    </strong>
</div>

<div class="row courier">
    <span>Courier Charges</span>
    <strong id="courier">
        Select state
    </strong>
</div>
<div class="courier-info" id="courierInfo">
    Select your state to calculate the courier charge.
</div>

<div class="row grand">
    <span>Amount Payable</span>
    <span id="grand">
        ₹${money(t.productTotal)}
    </span>
</div>
<button class="pay" id="reviewButton">
    Review Order Before Payment
</button>
        <a class="back-cart" href="cart.html">← Back to Cart</a>
        <div class="note" style="margin-top:15px"> Courier charges are applied once per bill. Product prices are inclusive of GST.
</div>
        </div>
    </div>`;

   document.getElementById("address")
    .addEventListener("input", updateCourier);

document.getElementById("state")
    .addEventListener("change", updateCourier);

document.getElementById("reviewButton")
    .addEventListener("click", proceedToReview);

document.getElementById("payButton")
    .addEventListener("click", pay);    

document.getElementById("applyCoupon")
    .addEventListener("click", applyCoupon);

document.getElementById("confirmOrder")
    .addEventListener("change", function(){

        document.getElementById("payButton").disabled =
            !this.checked;

    });

document.getElementById("editOrder")
    .addEventListener("click", function(){

        document
            .getElementById("reviewCard")
            .classList.remove("show");

        document.getElementById("confirmOrder").checked =
            false;

        document.getElementById("payButton").disabled =
            true;

        document.getElementById("fullName")
            .scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

    });
}

function updateCourier(){

    if (!courierConfig) return;

    const state =
        document.getElementById("state").value;

    const address =
        document.getElementById("address").value;

    const t = totals();

    if (!state) {

        document.getElementById("courier")
            .textContent = "Select state";

        document.getElementById("courierInfo")
            .textContent =
            "Select your state to calculate the courier charge.";

        document.getElementById("grand")
            .textContent =
            "₹" + money(t.productTotal);

        return;

    }

    const x =
        courier(address, state);

    document.getElementById("courier")
        .textContent =
        "₹" + money(x.charge);

    document.getElementById("courierInfo")
        .textContent =
        x.description;

    document.getElementById("grand")
        .textContent =
        "₹" +
        money(
            t.productTotal + x.charge
        );

}
    
function valid(){
    const name=document.getElementById("fullName").value.trim();
    const mobile=document.getElementById("mobile").value.trim();
    const email=document.getElementById("email").value.trim();
    const address=document.getElementById("address").value.trim();
    const city=document.getElementById("city").value.trim();
    const state=document.getElementById("state").value;
    const pin=document.getElementById("pincode").value.trim();

    if(!name)return showError("Please enter your full name."),false;
    if(!/^[0-9]{10}$/.test(mobile))return showError("Please enter a valid 10 digit mobile number."),false;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showError("Please enter a valid email address."),false;
    if(!address)return showError("Please enter your delivery address."),false;
    if(!city)return showError("Please enter your city or town."),false;
    if(!state)return showError("Please select your state."),false;
    if(!/^[0-9]{6}$/.test(pin))return showError("Please enter a valid 6 digit pincode."),false;
    return true;
}

function proceedToReview(){

    if (!valid()){
        return;
    }


    updateCourier();


    const final =
        getFinalAmount();


    const name =
        document
            .getElementById("fullName")
            .value.trim();

    const mobile =
        document
            .getElementById("mobile")
            .value.trim();

    const email =
        document
            .getElementById("email")
            .value.trim();

    const address =
        document
            .getElementById("address")
            .value.trim();

    const city =
        document
            .getElementById("city")
            .value.trim();

    const district =
        document
            .getElementById("district")
            .value.trim();

    const state =
        document
            .getElementById("state")
            .value;

    const pincode =
        document
            .getElementById("pincode")
            .value.trim();


    let productLines = "";


    cart.forEach(item => {

        const quantity =
            Number(
                item.quantity || 1
            );

        const price =
            Number(
                item.MRP || 0
            );

        const amount =
            price * quantity;


        productLines += `

            <div class="review-line">

                <span>

                    ${item.Name || "Solar Product"}

                    <br>

                    <small>
                        Model:
                        ${item.Model || "-"}
                        × ${quantity}
                        @ ₹${money(price)}
                    </small>

                </span>

                <strong>
                    ₹${money(amount)}
                </strong>

            </div>

        `;

    });


    document
        .getElementById("reviewContent")
        .innerHTML = `

        <div class="review-section">

            <div class="review-title">
                Products
            </div>

            ${productLines}

        </div>


        <div class="review-section">

            <div class="review-title">
                Customer Details
            </div>

            <div class="review-line">
                <span>Name</span>
                <strong>${name}</strong>
            </div>

            <div class="review-line">
                <span>Mobile</span>
                <strong>${mobile}</strong>
            </div>

            <div class="review-line">
                <span>Email</span>
                <strong>${email}</strong>
            </div>

        </div>


        <div class="review-section">

            <div class="review-title">
                Delivery Address
            </div>

            <div class="review-address">

                ${address}<br>

                ${city}
                ${district
                    ? ", " + district
                    : ""
                }<br>

                ${state} -
                ${pincode}

            </div>

        </div>


        <div class="review-section">

            <div class="review-title">
                Payment Summary
            </div>


            <div class="review-line">

                <span>
                    Product Total (incl. GST)
                </span>

                <strong>
                    ₹${money(
                        final.productTotal
                    )}
                </strong>

            </div>


            <div class="review-line">

                <span>
                    Courier Charges
                </span>

                <strong>
                    ₹${money(
                        final.courierCharge
                    )}
                </strong>

            </div>


            <div id="reviewDiscount">

                ${
                    final.couponDiscount > 0

                    ? `
                        <div class="review-line discount">

                            <span>
                                Coupon Code Discount
                            </span>

                            <strong>
                                -₹${money(
                                    final.couponDiscount
                                )}
                            </strong>

                        </div>
                      `

                    : ""
                }

            </div>


            <div class="final-total">

                Amount Payable:

                <span id="reviewGrand">

                    ₹${money(
                        final.grandTotal
                    )}

                </span>

            </div>


            <div class="note">

                Product prices shown are inclusive
                of GST. No additional GST is added.

            </div>

        </div>

    `;


    document
        .getElementById("reviewCard")
        .classList
        .add("show");


    document
        .getElementById("reviewCard")
        .scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

}

function pay(){

    if (!valid()){
        return;
    }


    if (
        !document
            .getElementById("confirmOrder")
            .checked
    ){

        showError(
            "Please confirm that the order details are correct before proceeding to payment."
        );

        return;

    }


    const final =
        getFinalAmount();


    alert(

        "Final Order Confirmed.\n\n" +

        "Product Total (incl. GST): ₹" +
        money(final.productTotal) +

        "\nCourier Charges: ₹" +
        money(final.courierCharge) +

        (
            final.couponDiscount > 0

            ? "\nCoupon Code Discount: -₹" +
              money(final.couponDiscount)

            : ""
        ) +

        "\nAmount Payable: ₹" +
        money(final.grandTotal) +

        "\n\nRazorpay will be connected next."

    );

}



// ==========================================
// INITIALIZE CHECKOUT PAGE
// ==========================================

async function initializeCheckout(){

    try{

        // Load cart from localStorage
        loadCart();


        // If cart is empty, show empty-cart message
        if(!cart.length){

            render();

            return;

        }


        // Load courier configuration
        try{

            const courierResponse =
                await fetch(COURIER_URL);

            if(courierResponse.ok){

                courierConfig =
                    await courierResponse.json();

            }else{

                courierConfig = {};

            }

        }catch(error){

            console.error(
                "Courier JSON loading error:",
                error
            );

            courierConfig = {};

        }


        // Load coupon configuration
        try{

            const couponResponse =
                await fetch(COUPON_URL);

            if(couponResponse.ok){

                couponConfig =
                    await couponResponse.json();

            }else{

                couponConfig = {
                    Coupons:[]
                };

            }

        }catch(error){

            console.error(
                "Coupon JSON loading error:",
                error
            );

            couponConfig = {
                Coupons:[]
            };

        }


        // Finally render the checkout page
        render();


    }catch(error){

        console.error(
            "Checkout initialization error:",
            error
        );

        showError(
            "Unable to load the checkout page. Please refresh and try again."
        );

    }

}


// Start checkout
initializeCheckout();    
    
</script>
